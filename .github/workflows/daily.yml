name: Daily Coding Problem

on:
  schedule:
    # Every day at 08:23 UTC (09:23 Irish summer time). Odd minute avoids GitHub's busy :00 slot.
    - cron: "23 8 * * *"
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-problem
  cancel-in-progress: false

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate today's problem
        id: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}
        run: python agent.py

      - name: Commit and push
        env:
          # Commits only count on your contribution graph if this email is linked to your GitHub account.
          GIT_NAME: ${{ vars.GIT_NAME }}
          GIT_EMAIL: ${{ vars.GIT_EMAIL }}
          TITLE: ${{ steps.agent.outputs.title }}
        run: |
          if [ -z "$GIT_EMAIL" ]; then
            echo "::error::Set the GIT_EMAIL repository variable (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          git config user.name  "${GIT_NAME:-$GITHUB_ACTOR}"
          git config user.email "$GIT_EMAIL"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Solve: ${TITLE:-daily problem} ($(date -u +%F))"
          git push
